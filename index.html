<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sub5conscious Ver 2.7 - Competitive</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #030308; --line: #222530; --p1: #00f0ff; --p2: #ff00c8;
            --text: #c0c5d0; --ui-bg: rgba(5, 7, 15, 0.98); --font: 'Courier New', monospace;
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
            height: 100vh; overflow: hidden; user-select: none;
        }
        
        /* SCENES */
        .scene { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; }
        .active { display: flex; }
        
        /* LOBBY UI */
        #lobby { justify-content: center; align-items: center; text-align: center; gap: 30px; }
        .room-box { background: rgba(255,255,255,0.03); border: 1px solid var(--line); padding: 30px; width: 320px; }
        input[type="text"] { 
            background: #000; border: 1px solid #444; color: var(--p1); 
            padding: 12px; width: 100%; text-align: center; font-family: inherit; margin-bottom: 15px;
        }
        .loading-spin { border: 2px solid #222; border-top: 2px solid var(--p1); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* GAME LAYOUT (TYPE 1) */
        .ui-bar { height: 90px; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--line); }
        .bottom-bar { border-bottom: none; border-top: 1px solid var(--line); }
        .timer-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .bar-track { width: 100%; height: 4px; background: #111; margin: 10px 0; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }

        #stage { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: radial-gradient(circle, #0a0a15 0%, #030308 100%); }
        
        /* GRID & COORDINATES */
        .grid-container { position: relative; padding: 25px; border: 1px solid var(--line); }
        #grid { 
            display: grid; grid-template-columns: repeat(8, 1fr); 
            width: 80vw; height: 80vw; max-width: 480px; max-height: 480px;
        }
        .cell { border: 0.5px solid var(--line); position: relative; cursor: pointer; }
        .cell::before { content: attr(data-coord); position: absolute; top: 2px; left: 2px; font-size: 8px; color: #444; pointer-events: none; }
        
        /* Coordinate Labels */
        .axis-h { position: absolute; bottom: 0; left: 25px; right: 25px; display: flex; justify-content: space-around; font-size: 10px; color: #666; height: 20px; align-items: center; }
        .axis-v { position: absolute; left: 0; top: 25px; bottom: 25px; display: flex; flex-direction: column; justify-content: space-around; font-size: 10px; color: #666; width: 20px; align-items: center; }

        /* PIECES */
        .pce { position: absolute; inset: 15%; border-radius: 50%; pointer-events: none; transition: 0.3s; }
        .stl { border: 2px dashed currentColor; opacity: 0.5; animation: blink 2s infinite; }
        .opn { background: currentColor; box-shadow: 0 0 20px currentColor; }
        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.6; } }
        
        #fx { position: absolute; inset: 0; pointer-events: none; z-index: 100; }

        /* BUTTONS */
        .btn { border: 1px solid var(--text); background: transparent; color: inherit; padding: 12px 20px; cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: 2px; transition: 0.2s; }
        .btn:hover { background: var(--text); color: #000; }
        .ctrl-btns { display: flex; justify-content: space-around; font-size: 24px; padding: 5px; }
        .sym { cursor: pointer; opacity: 0.6; }
        .sym:hover { opacity: 1; }

        .menu-overlay { position: fixed; inset: 0; background: var(--ui-bg); z-index: 200; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
    </style>
</head>
<body>

<div id="scene-home" class="scene active">
    <div id="lobby">
        <h1 style="letter-spacing:15px; font-weight:lighter;">sub5conscious</h1>
        <div class="room-box">
            <button class="btn" onclick="NET.createRoom()" style="width:100%;">CREATE ROOM</button>
            <p style="font-size:10px; margin:20px 0;">- OR -</p>
            <input type="text" id="join-id" placeholder="ENTER ROOM ID">
            <button class="btn" onclick="NET.joinRoom()" style="width:100%;">JOIN ROOM</button>
        </div>
    </div>
</div>

<div id="scene-wait" class="scene">
    <div id="lobby">
        <h2 style="letter-spacing:5px;">WAITING FOR GUEST</h2>
        <div class="room-box">
            <p style="font-size:10px; color:var(--p1);">ROOM ID (CLICK TO COPY)</p>
            <h3 id="display-id" style="cursor:pointer; letter-spacing:2px; background:#000; padding:15px; border:1px solid var(--p1);" onclick="NET.copyID()">---</h3>
            <div class="loading-spin"></div>
            <button class="btn" onclick="location.reload()" style="font-size:10px;">CANCEL</button>
        </div>
    </div>
</div>

<div id="scene-game" class="scene">
    <div class="ui-bar">
        <div class="timer-info">
            <span id="label-op">OPPONENT</span>
            <span id="t2-val">05:00 [30]</span>
        </div>
        <div class="bar-track"><div id="f-p2" class="bar-fill" style="background:var(--p2)"></div></div>
    </div>

    <div id="stage">
        <div class="grid-container">
            <div class="axis-v"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
            <div id="grid"></div>
            <div class="axis-h"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
            <canvas id="fx"></canvas>
        </div>
    </div>

    <div class="ui-bar bottom-bar">
        <div class="bar-track"><div id="f-p1" class="bar-fill" style="background:var(--p1)"></div></div>
        <div class="timer-info">
            <span id="t1-val">05:00 [30]</span>
            <span id="turn-val">TURN 1</span>
        </div>
        <div class="ctrl-btns">
            <div class="sym" onclick="GAME.resetReq()">⟲</div>
            <div class="sym" onclick="APP.toggleMenu()">≡</div>
            <div class="sym" onclick="GAME.resignReq()">×</div>
        </div>
    </div>
</div>

<div id="menu" class="menu-overlay">
    <div style="text-align:center; padding:30px; border:1px solid #333;">
        <h3 style="margin:0 0 20px 0;">MATCH SETTINGS</h3>
        <label>TIME: <input type="number" id="cfg-t" value="300" style="width:60px; background:none; border:1px solid #555; color:#fff; text-align:center;">s</label><br><br>
        <label>BYO : <input type="number" id="cfg-b" value="30" style="width:60px; background:none; border:1px solid #555; color:#fff; text-align:center;">s</label>
    </div>
    <button class="btn" onclick="APP.toggleMenu()">CONTINUE</button>
    <button class="btn" onclick="location.reload()">EXIT GAME</button>
</div>

<script>
/**
 * sub5conscious Ver 2.7 - Highly Competitive Version
 */

const STATE = {
    board: [], p: 1, actions: [], history: [], winner: null,
    time: [300, 300], byo: [30, 30], isByo: [false, false],
    conf: { t: 300, b: 30 }, timerInt: null
};

const APP = {
    switch(id) {
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.getElementById('scene-' + id).classList.add('active');
    },
    toggleMenu() {
        const m = document.getElementById('menu');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }
};

const GAME = {
    start(p1IsHost, t, b) {
        STATE.board = Array.from({length: 64}, () => ({s:0, o:0}));
        STATE.p = 1; STATE.actions = []; STATE.winner = null; STATE.history = [];
        STATE.conf.t = t; STATE.conf.b = b;
        STATE.time = [t, t]; STATE.byo = [b, b];
        STATE.isByo = [false, false];

        NET.myNum = (NET.role === 'HOST') ? (p1IsHost ? 1 : 2) : (p1IsHost ? 2 : 1);
        
        this.initGrid();
        if(this.timerInt) clearInterval(this.timerInt);
        this.timerInt = setInterval(() => this.tick(), 100);
        
        APP.switch('game');
        document.getElementById('label-op').innerText = `OPPONENT (P${NET.myNum===1?2:1})`;
    },

    initGrid() {
        const g = document.getElementById('grid'); g.innerHTML = '';
        const cols = ['A','B','C','D','E','F','G','H'];
        for(let i=0; i<64; i++) {
            const d = document.createElement('div');
            d.className = 'cell';
            const coord = cols[i%8] + (8 - Math.floor(i/8));
            d.setAttribute('data-coord', coord);
            d.onclick = () => this.click(i);
            g.appendChild(d);
        }
    },

    click(i) {
        if(STATE.winner || STATE.p !== NET.myNum) return;
        const cell = STATE.board[i];
        
        // 1手目キャンセル：自駒のOpen駒(s=2)をタップするか、1手目の無効距離タップ
        if(cell.s === 2) { this.cancelMove(); return; }
        if(STATE.actions.length === 1) {
            const f = STATE.actions[0];
            const dist = Math.abs(Math.floor(i/8)-Math.floor(f/8)) + Math.abs((i%8)-(f%8));
            if(i !== f && dist !== 1) { this.cancelMove(); return; }
        }

        STATE.actions.push(i);
        NET.send({type:'act', i});
        this.render();
        if(STATE.actions.length === 2) this.resolve();
    },

    cancelMove() {
        STATE.actions = [];
        NET.send({type:'cancel'});
        this.render();
    },

    resolve() {
        const turnP = STATE.p;
        STATE.actions.forEach(idx => {
            const c = STATE.board[idx];
            if(c.s === 0) { c.s = 1; c.o = turnP; }
            else if(c.s === 1) { c.s = 2; c.o = turnP; FX.burst(idx, turnP); }
        });

        STATE.history.push([...STATE.actions]);
        if(this.winCheck()) { this.endMatch(turnP); return; }

        STATE.p = turnP === 1 ? 2 : 1;
        STATE.byo[turnP-1] = STATE.conf.b; 
        STATE.actions = [];
        this.render();
    },

    winCheck() {
        const b = STATE.board; const p = STATE.p;
        const dirs = [1, 8, 9, 7];
        for(let i=0; i<64; i++) {
            if(b[i].s===2 && b[i].o===p) {
                for(let d of dirs) {
                    let c=1;
                    for(let s=1; s<5; s++) {
                        let n = i+d*s;
                        if(n>=0 && n<64) {
                            // 横方向の境界チェック
                            if(d===1 && Math.floor(n/8)!==Math.floor(i/8)) break;
                            if(d===9 && n%8 <= i%8) break;
                            if(d===7 && n%8 >= i%8) break;
                            if(b[n].s===2 && b[n].o===p) c++; else break;
                        } else break;
                    }
                    if(c>=5) return true;
                }
            }
        }
        return false;
    },

    tick() {
        const idx = STATE.p - 1;
        if(!STATE.isByo[idx]) {
            STATE.time[idx] -= 0.1;
            if(STATE.time[idx] <= 0) { STATE.time[idx] = 0; STATE.isByo[idx] = true; }
        } else {
            STATE.byo[idx] -= 0.1;
            if(STATE.byo[idx] <= 0) this.endMatch(STATE.p===1?2:1, "TIME UP");
        }
        this.updateClockUI();
    },

    updateClockUI() {
        const fmt = (s) => {
            const m = Math.floor(Math.max(0,s)/60); const sec = Math.floor(Math.max(0,s)%60);
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        };
        const p1Val = `${fmt(STATE.time[0])} [${Math.ceil(STATE.byo[0])}]`;
        const p2Val = `${fmt(STATE.time[1])} [${Math.ceil(STATE.byo[1])}]`;
        
        const myIdx = NET.myNum - 1;
        const opIdx = myIdx === 0 ? 1 : 0;

        document.getElementById('t1-val').innerText = (NET.myNum === 1 ? p1Val : p2Val);
        document.getElementById('t2-val').innerText = (NET.myNum === 1 ? p2Val : p1Val);
        
        document.getElementById('f-p1').style.width = (STATE.time[myIdx]/STATE.conf.t*100)+'%';
        document.getElementById('f-p2').style.width = (STATE.time[opIdx]/STATE.conf.t*100)+'%';
    },

    render() {
        const cells = document.querySelectorAll('.cell');
        STATE.board.forEach((c, i) => {
            cells[i].innerHTML = '';
            cells[i].classList.remove('act');
            if(STATE.actions.includes(i)) cells[i].classList.add('act');

            // 競技用ステルスロジック:
            // s=2(開示)は全員に見える。s=1(潜伏)はオーナーにしか見えない。
            if(c.s === 2) {
                const color = c.o === 1 ? 'var(--p1)' : 'var(--p2)';
                cells[i].innerHTML = `<div class="pce opn" style="color:${color}"></div>`;
            } else if(c.s === 1 && c.o === NET.myNum) {
                const color = c.o === 1 ? 'var(--p1)' : 'var(--p2)';
                cells[i].innerHTML = `<div class="pce stl" style="color:${color}"></div>`;
            }
        });
        document.getElementById('turn-val').innerText = `TURN ${STATE.history.length + 1}`;
    },

    endMatch(w, reason="") {
        STATE.winner = w; clearInterval(this.timerInt);
        alert(`PLAYER ${w} WINS! ${reason}`);
    },

    resignReq() { if(confirm("RESIGN? (×)")) { NET.send({type:'resign'}); this.endMatch(NET.myNum===1?2:1, "(RESIGNED)"); } },
    resetReq() { if(confirm("REQUEST RESET? (⟲)")) { NET.send({type:'reset_req'}); } }
};

const NET = {
    peer: null, conn: null, myNum: 1, role: '',
    init() {
        this.peer = new Peer();
        this.peer.on('open', id => this.myId = id);
        this.peer.on('connection', c => {
            this.conn = c; this.role = 'HOST'; this.setup();
            this.conn.on('open', () => {
                const p1IsHost = Math.random() < 0.5;
                const t = parseInt(document.getElementById('cfg-t').value);
                const b = parseInt(document.getElementById('cfg-b').value);
                this.send({type:'init', p1IsHost, t, b});
                GAME.start(p1IsHost, t, b);
            });
        });
    },
    createRoom() {
        if(!this.myId) return alert("P2P Initializing...");
        this.role = 'HOST';
        document.getElementById('display-id').innerText = this.myId;
        APP.switch('wait');
    },
    joinRoom() {
        const id = document.getElementById('join-id').value;
        if(!id) return alert("ENTER ROOM ID");
        this.role = 'GUEST';
        this.conn = this.peer.connect(id);
        this.setup();
    },
    copyID() {
        navigator.clipboard.writeText(this.myId).then(() => alert("ID COPIED"));
    },
    setup() {
        this.conn.on('data', d => {
            if(d.type==='init') GAME.start(d.p1IsHost, d.t, d.b);
            if(d.type==='act') { STATE.actions.push(d.i); GAME.render(); if(STATE.actions.length===2) GAME.resolve(); }
            if(d.type==='cancel') GAME.cancelMove();
            if(d.type==='resign') GAME.endMatch(NET.myNum, "(OPPONENT RESIGNED)");
            if(d.type==='reset_req') { if(confirm("ACCEPT RESET?")) { this.send({type:'reset_ok'}); GAME.start(NET.myNum===1, STATE.conf.t, STATE.conf.b); } }
            if(d.type==='reset_ok') GAME.start(NET.myNum===1, STATE.conf.t, STATE.conf.b);
        });
        this.conn.on('close', () => { alert("DISCONNECTED"); location.reload(); });
    },
    send(d) { if(this.conn && this.conn.open) this.conn.send(d); }
};

const FX = {
    pts: [],
    init() {
        const c = document.getElementById('fx'); const ctx = c.getContext('2d');
        const loop = () => {
            c.width = c.offsetWidth; c.height = c.offsetHeight;
            ctx.clearRect(0,0,c.width,c.height);
            this.pts.forEach((p,i) => {
                p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.vy*=0.96; p.l-=0.02;
                ctx.globalAlpha = Math.max(0, p.l); ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill();
                if(p.l<=0) this.pts.splice(i,1);
            });
            requestAnimationFrame(loop);
        };
        loop();
    },
    burst(i, p) {
        const r = document.getElementById('grid').getBoundingClientRect();
        const cw = r.width/8;
        const x = (i%8)*cw+cw/2; const y = Math.floor(i/8)*cw+cw/2;
        const color = p===1 ? '#00f0ff' : '#ff00c8';
        for(let n=0; n<40; n++) this.pts.push({
            x, y, vx:(Math.random()-0.5)*18, vy:(Math.random()-0.5)*18,
            l:1, s:Math.random()*5+1, c:color
        });
    }
};

NET.init();
FX.init();
</script>
</body>
</html>
